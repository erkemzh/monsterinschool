<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="horrorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background metallic plate with rivets -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" stroke="#3f3f46" stroke-width="8" />

  <!-- Rusty Door Slit / Peep window -->
  <rect x="76" y="160" width="360" height="130" rx="16" fill="#000000" stroke="#71717a" stroke-width="6" />

  <!-- Monster Glowing Demonic Eyes inside slit -->
  <ellipse cx="190" cy="225" rx="44" ry="22" fill="url(#eyeGlow)" filter="url(#horrorGlow)" />
  <ellipse cx="322" cy="225" rx="44" ry="22" fill="url(#eyeGlow)" filter="url(#horrorGlow)" />
  
  <!-- Slit Pupils -->
  <ellipse cx="190" cy="225" rx="6" ry="18" fill="#ffffff" />
  <ellipse cx="322" cy="225" rx="6" ry="18" fill="#ffffff" />

  <!-- Soviet Star / Occult Warning Symbol -->
  <g transform="translate(256, 360)">
    <polygon points="0,-36 10,-10 36,-10 16,6 24,32 0,16 -24,32 -16,6 -36,-10 -10,-10" fill="#b91c1c" stroke="#f87171" stroke-width="2" />
  </g>

  <!-- Text: THE FORGOTTEN WING -->
  <text x="256" y="105" text-anchor="middle" font-family="monospace, sans-serif" font-weight="900" font-size="28" fill="#e4e4e7" letter-spacing="4">ПРОКЛЯТЫЙ ФЛИГЕЛЬ</text>
  <text x="256" y="132" text-anchor="middle" font-family="monospace, sans-serif" font-weight="700" font-size="16" fill="#ef4444" letter-spacing="6">THE FORGOTTEN WING</text>

  <!-- Biohazard warning lines -->
  <line x1="80" y1="440" x2="432" y2="440" stroke="#dc2626" stroke-width="4" stroke-dasharray="16,8" />
  <text x="256" y="475" text-anchor="middle" font-family="monospace, sans-serif" font-weight="800" font-size="16" fill="#a1a1aa" letter-spacing="5">ОПАСНАЯ ЗОНА • ВХОД ВОСПРЕЩЁН</text>
</svg>
